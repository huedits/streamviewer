<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Stream Viewer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Control Bar -->
    <div class="control-bar">
        <select id="platformSelect">
            <option value="twitch">Twitch</option>
            <option value="kick">Kick</option>
            <option value="youtube">YouTube</option>
        </select>
        <input 
            type="text" 
            id="streamInput" 
            placeholder="Enter channel name or video ID..."
        />
        <button class="add-btn" id="addBtn" title="Add Stream">+</button>
        <button class="remove-all-btn" id="removeAllBtn" title="Remove All Streams">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/>
            </svg>
        </button>
        
        <!-- Volume Control -->
        <div class="volume-control" id="volumeControl" title="Master Volume">
            <button class="volume-icon-btn" id="volumeIconBtn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" id="volumeIcon">
                    <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                </svg>
            </button>
            <input 
                type="range" 
                id="volumeSlider" 
                class="volume-slider" 
                min="0" 
                max="100" 
                value="50" 
                title="Master Volume"
            />
            <span class="volume-value" id="volumeValue">50</span>
        </div>
    </div>

    <!-- Main Content Area -->
    <div class="main-content">
        <!-- Stream Grid -->
        <div class="stream-container" id="streamContainer">
            <div class="empty-state">
                <div class="icon">📺</div>
                <p>No streams added yet</p>
                <p>Select a platform, enter a <span>channel name</span> and click <span>+</span></p>
            </div>
        </div>

        <!-- Chat Toggle Button -->
        <button class="chat-reopen-btn" id="chatReopenBtn" title="Open chat">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
            </svg>
        </button>

        <!-- Chat Panel -->
        <div class="chat-panel" id="chatPanel">
            <div class="chat-header">
                <span class="chat-title">Chat</span>
                <button class="chat-close-btn" id="chatCloseBtn" title="Close chat">×</button>
            </div>
            <div class="chat-tabs" id="chatTabs">
                <!-- Chat tabs will be added dynamically -->
            </div>
            <div class="chat-container" id="chatContainer">
                <div class="chat-empty">
                    <span>💬</span>
                    <p>Select a stream to view chat</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="footer-content">
            <span class="footer-text">Multi-Stream Viewer</span>
            <span class="footer-separator">|</span>
            <span class="footer-version" id="versionDisplay">v1.0.0</span>
        </div>
    </footer>

    <!-- Scripts in dependency order -->
    <script src="js/config.js"></script>
    <script src="js/state.js"></script>
    <script src="js/embed.js"></script>
    <script src="js/volume.js"></script>
    <script src="js/chat.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/dropdown.js"></script>
    <script src="js/events.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
